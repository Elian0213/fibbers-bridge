name: Release

# HACS installs an integration by downloading custom_components/<domain> at the
# tag ref, so there's nothing to build — this just cuts the GitHub release. The
# tag must match `version` in manifest.json.
on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
