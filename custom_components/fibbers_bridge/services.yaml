atv_swipe:
  name: Apple TV swipe
  description: >-
    Swipe on the Apple TV's touch surface (pyatv Companion protocol). Coordinates
    are 0-1000 on both axes. Reproduces the physical Siri Remote's touch swipe -
    e.g. scrubbing the timeline in apps like Netflix that report no position to
    Home Assistant.
  fields:
    device_id:
      name: Apple TV
      description: The Apple TV device to control.
      required: true
      selector:
        device:
          integration: apple_tv
    start_x:
      name: Start X
      description: Horizontal start position (0 = left, 1000 = right).
      required: true
      example: 500
      selector:
        number: { min: 0, max: 1000, mode: box }
    start_y:
      name: Start Y
      description: Vertical start position (0 = top, 1000 = bottom).
      required: true
      example: 500
      selector:
        number: { min: 0, max: 1000, mode: box }
    end_x:
      name: End X
      description: Horizontal end position.
      required: true
      example: 800
      selector:
        number: { min: 0, max: 1000, mode: box }
    end_y:
      name: End Y
      description: Vertical end position.
      required: true
      example: 500
      selector:
        number: { min: 0, max: 1000, mode: box }
    duration_ms:
      name: Duration
      description: Swipe duration in milliseconds.
      example: 400
      default: 500
      selector:
        number: { min: 1, max: 10000, unit_of_measurement: ms, mode: box }

atv_touch:
  name: Apple TV touch
  description: >-
    Send a single touch action (press / hold / release) at a point on the Apple
    TV's touch surface. Chain press -> release yourself for a custom gesture.
  fields:
    device_id:
      name: Apple TV
      description: The Apple TV device to control.
      required: true
      selector:
        device:
          integration: apple_tv
    x:
      name: X
      description: Horizontal position (0-1000).
      required: true
      example: 500
      selector:
        number: { min: 0, max: 1000, mode: box }
    y:
      name: Y
      description: Vertical position (0-1000).
      required: true
      example: 500
      selector:
        number: { min: 0, max: 1000, mode: box }
    mode:
      name: Mode
      description: The touch phase to send.
      required: true
      selector:
        select:
          options:
            - press
            - hold
            - release

atv_click:
  name: Apple TV click
  description: >-
    Click the Apple TV's touch surface (a select), as a single tap, double tap,
    or long hold.
  fields:
    device_id:
      name: Apple TV
      description: The Apple TV device to control.
      required: true
      selector:
        device:
          integration: apple_tv
    action:
      name: Action
      description: The kind of click.
      default: single
      selector:
        select:
          options:
            - single
            - double
            - hold

ambilight_start:
  name: Start ambilight sync
  description: >-
    Mirror a Philips TV's Ambilight colour onto an RGB light. The TV derives the
    colour from whatever is on screen - including a games console or any HDMI
    source - so the light tracks it live. Reads over the local JointSpace API.
  fields:
    entry_id:
      name: Philips Ambilight TV
      description: The paired TV to read colour from.
      required: true
      selector:
        config_entry:
          integration: fibbers_bridge
    target:
      name: Light
      description: The RGB light that should mirror the TV.
      required: true
      selector:
        entity:
          domain: light
    rate:
      name: Update rate
      description: How many colour updates per second (higher = smoother, more Wi-Fi traffic).
      default: 6
      selector:
        number: { min: 1, max: 20, unit_of_measurement: Hz, mode: slider }
    mode:
      name: Colour source
      description: >-
        "processed" is what the TV's own LEDs show; "measured" is the raw screen
        sample before processing.
      default: processed
      selector:
        select:
          options:
            - processed
            - measured

ambilight_stop:
  name: Stop ambilight sync
  description: Stop mirroring the TV colour onto a light.
  fields:
    target:
      name: Light
      description: The light to stop mirroring.
      required: true
      selector:
        entity:
          domain: light

ambilight_probe:
  name: Probe ambilight
  description: >-
    One-shot read of a TV's current Ambilight colour, raw payload and LED
    topology. Returns the data as a service response - use it to confirm pairing
    and see live values without wiring up a light.
  fields:
    entry_id:
      name: Philips Ambilight TV
      description: The paired TV to read from.
      required: true
      selector:
        config_entry:
          integration: fibbers_bridge
    mode:
      name: Colour source
      description: Which layer to read.
      default: processed
      selector:
        select:
          options:
            - processed
            - measured

tv_probe_settings:
  name: Probe TV settings API
  description: >-
    Ask a paired Philips TV what its JointSpace API really serves, ignoring what
    it advertises. Reports the HTTP status of each endpoint - so "not
    implemented" (404), "refused" (403) and "present but unadvertised" (200) stay
    telling apart - plus the addressable settings nodes if the settings tree
    exists. Read-only; changes nothing on the TV. Use it to find out whether
    brightness and picture profiles can be controlled on your model.
  fields:
    entry_id:
      name: Philips Ambilight TV
      description: The paired TV to probe.
      required: true
      selector:
        config_entry:
          integration: fibbers_bridge
    include_raw:
      name: Include raw structure
      description: >-
        Return the complete settings tree as well as the summary. Large - leave
        off unless you need the full node list.
      default: false
      selector:
        boolean:

tv_settings_list:
  name: List TV settings
  description: >-
    Read a paired Philips TV's settings tree and current values as one list a
    card can render - Ambilight brightness, saturation, styles, wall colour,
    ambisleep. Returns a response.
  fields:
    entry_id:
      name: Philips Ambilight TV
      description: The paired TV to read from.
      required: true
      selector:
        config_entry:
          integration: fibbers_bridge
    refresh:
      name: Refresh structure
      description: Re-fetch the settings tree instead of using the cached one.
      default: false
      selector:
        boolean:

tv_settings_get:
  name: Get TV setting values
  description: Read current values for specific settings node ids. Returns a response.
  fields:
    entry_id:
      name: Philips Ambilight TV
      description: The paired TV to read from.
      required: true
      selector:
        config_entry:
          integration: fibbers_bridge
    node_ids:
      name: Node ids
      description: The settings node ids to read.
      required: true
      example: "[710, 720]"
      selector:
        object:

tv_settings_set:
  name: Set a TV setting
  description: >-
    Write one settings node and confirm it by reading it back. Returns a response
    with `changed` - the TV answers OK to writes it silently ignores, so trust
    `changed`, not the call.
  fields:
    entry_id:
      name: Philips Ambilight TV
      description: The paired TV to write to.
      required: true
      selector:
        config_entry:
          integration: fibbers_bridge
    node_id:
      name: Node id
      description: The settings node to write.
      required: true
      example: 710
      selector:
        number: { min: 0, max: 100000, mode: box }
    value:
      name: Value
      description: >-
        The new value - a number for a slider, the option id for a list, a colour
        int for a colour node.
      example: 60
      selector:
        object:
    data:
      name: Raw data
      description: >-
        Advanced: the exact update payload, when a node needs more than a single
        value. Overrides `value`.
      selector:
        object:

tv_settings_sweep:
  name: Sweep TV settings nodes
  description: >-
    Diagnostic: read every settings node id in a range and report the ones that
    answer, to discover nodes the structure tree omits. A few hundred requests -
    run it by hand, not from a dashboard.
  fields:
    entry_id:
      name: Philips Ambilight TV
      description: The paired TV to sweep.
      required: true
      selector:
        config_entry:
          integration: fibbers_bridge
    start:
      name: First node id
      required: true
      example: 1
      selector:
        number: { min: 0, max: 100000, mode: box }
    end:
      name: Last node id
      required: true
      example: 300
      selector:
        number: { min: 0, max: 100000, mode: box }
    step:
      name: Step
      description: Id increment.
      default: 1
      selector:
        number: { min: 1, max: 1000, mode: box }

tv_send_keys:
  name: Send TV key sequence
  description: >-
    Send a sequence of remote keys to the TV server-side with exact timing (one
    call, no per-key round trip). Returns per-key status. Cannot report what the
    TV now shows - Titan OS gives no feedback.
  fields:
    entry_id:
      name: Philips TV
      description: The paired TV to send to.
      required: true
      selector:
        config_entry:
          integration: fibbers_bridge
    keys:
      name: Keys
      description: >-
        A list of keys. Each is a name (e.g. "CursorUp") or an object with
        repeat / settle_ms / delay_ms, or a select: {direction, index, length}.
      required: true
      example: '["Home", {"key": "CursorUp", "repeat": 2}, "Confirm"]'
      selector:
        object:
    delay_ms:
      name: Delay between keys
      default: 600
      selector:
        number: { min: 0, max: 10000, unit_of_measurement: ms, mode: box }
    settle_ms:
      name: Settle after screen change
      selector:
        number: { min: 0, max: 10000, unit_of_measurement: ms, mode: box }
    anchor:
      name: Anchor
      description: '"home" prepends Back x3 -> Home so the sequence starts from a known screen.'
      selector:
        select:
          options: [home]

tv_macro:
  name: Run a TV macro
  description: >-
    Run a named, per-model key macro (e.g. picture_style). Reports what was sent,
    never what the TV now is - it cannot read TV state back.
  fields:
    entry_id:
      name: Philips TV
      required: true
      selector:
        config_entry:
          integration: fibbers_bridge
    macro:
      name: Macro
      required: true
      example: picture_style
      selector:
        text:
    args:
      name: Arguments
      example: '{"index": 2}'
      selector:
        object:

tv_macro_list:
  name: List TV macros
  description: List the macros that match a TV, with their args and verified flag.
  fields:
    entry_id:
      name: Philips TV
      required: true
      selector:
        config_entry:
          integration: fibbers_bridge

probe_notebook_create:
  name: Create a probe notebook
  description: Start a notebook for an investigation.
  fields:
    name:
      name: Name
      required: true
      selector:
        text:
    target:
      name: Target
      description: What is being probed (free text).
      selector:
        text:
    device:
      name: Device
      description: Device facts to put in the exported header.
      selector:
        object:

probe_notebook_list:
  name: List probe notebooks
  description: List notebooks and their entry counts.

probe_notebook_delete:
  name: Delete a probe notebook
  fields:
    notebook:
      name: Notebook id
      required: true
      selector:
        text:

probe_fire:
  name: Fire a probe
  description: >-
    Send a stimulus and record it in one action, so an observation is never lost.
    Records what was sent; a human adds what they saw with probe_annotate.
  fields:
    notebook:
      name: Notebook id
      required: true
      selector:
        text:
    kind:
      name: Kind
      required: true
      selector:
        select:
          options: [remote_key, service, http]
    entry_id:
      name: Philips TV
      description: Required for remote_key / http.
      selector:
        config_entry:
          integration: fibbers_bridge
    target:
      name: Target
      selector:
        text:
    stimulus:
      name: Stimulus
      description: '{keys:[...]} | {domain,service,data} | {method,path}'
      selector:
        object:

probe_annotate:
  name: Annotate a probe entry
  description: Attach an observation, outcome and tags (defaults to the latest entry).
  fields:
    notebook:
      name: Notebook id
      required: true
      selector:
        text:
    id:
      name: Entry id
      description: Defaults to the most recent entry.
      selector:
        text:
    observation:
      name: Observation
      selector:
        text:
    outcome:
      name: Outcome
      selector:
        select:
          options: [works, nothing, error, unknown]
    tags:
      name: Tags
      selector:
        object:

probe_note:
  name: Add a probe note
  description: A free-text entry with no stimulus, for context.
  fields:
    notebook:
      name: Notebook id
      required: true
      selector:
        text:
    text:
      name: Text
      required: true
      selector:
        text:

probe_export:
  name: Export a probe notebook
  description: Render a notebook as markdown, returned as a response.
  fields:
    notebook:
      name: Notebook id
      required: true
      selector:
        text:

probe_promote:
  name: Promote entries to a macro
  description: >-
    Turn a selected run of entries into a reusable macro file (collapses repeats,
    prepends the Home anchor).
  fields:
    notebook:
      name: Notebook id
      required: true
      selector:
        text:
    name:
      name: Macro name
      required: true
      selector:
        text:
    entry_ids:
      name: Entry ids
      description: The entries to include; omit for the whole notebook.
      selector:
        object:
    args:
      name: Arguments spec
      selector:
        object:
